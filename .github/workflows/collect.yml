name: 공모주 데이터 수집

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST (전날 공시까지 반영)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:collector
      - run: npm run collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add collector/data/ipos.json
          git diff --cached --quiet || git commit -m "data: 공모주 데이터 갱신 $(date -u +%F)"
          git push
